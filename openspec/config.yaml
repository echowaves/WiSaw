schema: spec-driven

context: |
  Tech stack: React Native 0.86.2, Expo 57.0.14, Expo Router 57.0.14, React 19.2.3
  State management: Jotai 2.20.2 (atomic state)
  API: Apollo Client 4.2.12, GraphQL 17.0.2 with WebSocket subscriptions
  Storage: expo-secure-store for sensitive data
  Platforms: iOS, Android, Web
  Domain: Location-based anonymous social photo sharing app (WiSaw)
  Architecture: File-based routing (Expo Router), modular screens with reducers and custom hooks
  Language: JavaScript with gradual TypeScript adoption in router files
  Key conventions: Kebab-case file names, screen-level state with Jotai atoms, anonymous user identity via device UUID
  Dependencies: Always use exact versions in package.json (no ^ or ~ prefixes)
  Package manager: npm
  Backend repo: /Users/dmitry/hacks/wisaw/Wisaw.cdk (absolute path, sibling to this workspace
  Version Control: never perform any version control operations (git add, commit, push, etc.) in this workspace. The user will handle version control outside of this workspace.


rules:
  tasks:
    - When adding or updating dependencies, always use exact versions (e.g., "1.2.3" not "^1.2.3" or "~1.2.3"). Use --save-exact with npm install.
    - Always write code in a modular fashion, separating concerns into different files and components.
    - Always include error handling and loading states for asynchronous operations (e.g., data fetching,
    - For accessing back end API, always refer to the GraphQL schema at https://github.com/echowaves/WiSaw.cdk/blob/main/graphql/schema.graphql , use github mcp server for that. 
    - All generated code must have a maximum cyclomatic complexity of 8 or less. Refactor complex functions by extracting helper functions, using early returns, and breaking down conditional logic into smaller reusable pieces.
    - When in explore or in propose stage, do not attempt to start application. The user will handle starting the application and managing the development environment. Focus on providing code snippets, explanations, and guidance. 

  dependencies:
    - Do not add any new dependencies to the project unless the user explicitly requests or approves it. Solve problems using existing dependencies and built-in APIs first.
    - Always use the expo-cached-image package for image caching and displaying cached images. Do not replace it with custom wrappers or alternative libraries.
    - Always use the expo-storage package for key-value storage. Do not replace it with custom wrappers or direct AsyncStorage usage.
     - The latest backend code can be found at /Users/dmitry/hacks/wisaw/Wisaw.cdk
  security:
    - The .env file must never be committed to version control. It must remain in .gitignore at all times.
    - Secrets and sensitive values from .env (API keys, tokens, credentials, connection strings) must never be hardcoded or leaked into any versioned file. Always reference them via environment variables at runtime.
